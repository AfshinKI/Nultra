plugins { id 'com.android.application' }
android {
    namespace 'com.afshinki.nultra'
    compileSdk 35
    defaultConfig {
        applicationId 'com.afshinki.nultra'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
    signingConfigs {
        release {
            if (System.getenv('NULTRA_KEYSTORE')) {
                storeFile file(System.getenv('NULTRA_KEYSTORE'))
                storePassword System.getenv('NULTRA_STORE_PASSWORD')
                keyAlias 'nultra'
                keyPassword System.getenv('NULTRA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
