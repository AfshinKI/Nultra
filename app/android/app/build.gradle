plugins { id 'com.android.application' }
android {
    namespace 'com.afshinki.nultra'
    compileSdk 35
    defaultConfig {
        applicationId 'com.afshinki.nultra'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 9
        versionName '0.9.0'
    }
    signingConfigs {
        release {
            if (System.getenv('NULTRA_KEYSTORE')) {
                storeFile file(System.getenv('NULTRA_KEYSTORE'))
                storePassword System.getenv('NULTRA_STORE_PASSWORD')
                keyAlias 'nultra'
                keyPassword System.getenv('NULTRA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
